<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Stop Personalized Career & Education Advisor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- AOS CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <!-- Humanoid AI Avatar Styles -->
    <link rel="stylesheet" href="css/humanoid.css">
</head>
<body class="relative min-h-screen flex flex-col items-center justify-center overflow-hidden">

    <!-- Loading Screen -->
    <div id="loader" class="loader-wrapper">
        <div class="loader"></div>
    </div>

    <!-- Background Blobs -->
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <main class="relative z-10 text-center px-4 hero-content w-full max-w-4xl mx-auto flex flex-col items-center justify-center h-screen">
        <h1 class="text-5xl md:text-7xl font-bold mb-6 text-white tracking-tight" data-aos="fade-down">
            One Stop Personalized <br/>
            <span class="text-gradient-purple">Career & Education Advisor</span>
        </h1>
        
        <p class="text-xl md:text-2xl text-gray-300 mb-10 max-w-2xl" data-aos="fade-up" data-aos-delay="200">
            AI-powered platform to discover your future career.
        </p>
        
        <div data-aos="zoom-in" data-aos-delay="400">
            <!-- Directly go to dashboard HTML on load or manual click -->
            <a href="dashboard.html" class="inline-flex items-center justify-center px-8 py-4 text-lg font-semibold text-white bg-indigo-600 rounded-full btn-glow hover:bg-indigo-500 transition-colors shadow-lg">
                Enter Dashboard <svg class="w-5 h-5 ml-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </a>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="js/main.js"></script>
    <!-- Humanoid AI Avatar Script -->
    <script src="js/humanoid.js"></script>

    <script>
        // Auto-redirect to dashboard as per user requirement (Guest mode instantly loading dashboard)
        // With a slight delay so the user can appreciate the hero animation.
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 3500); // 3.5s delay to view the stunning landing page before auto-entering
        });
    </script>
</body>
</html>
