<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptitude Test - Career Advisor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body class="bg-[#0f172a] text-white overflow-hidden h-screen flex flex-col">

    <!-- Background Elements -->
    <div class="blob blob-1"></div>
    <div class="blob blob-3"></div>

    <!-- Navigation -->
    <nav class="glass sticky top-0 w-full z-50 px-6 py-4 flex justify-between items-center">
        <a href="index.html" class="flex items-center gap-3 text-2xl font-bold hover:opacity-80 transition cursor-pointer">
            <img src="assets/logo.svg" alt="Career101 Logo" style="height: 36px; object-fit: contain;">
        </a>
        <div>
            <a href="dashboard.html" class="px-5 py-2 rounded-full border border-gray-500 text-gray-300 hover:bg-gray-800 transition">Back to Dashboard</a>
        </div>
    </nav>

    <!-- Quiz Container -->
    <div class="flex-grow flex items-center justify-center relative page-transition">
        
        <div class="w-full max-w-3xl px-4 z-10">
            <!-- Progress Bar -->
            <div class="mb-8" id="progress-container">
                <div class="flex justify-between text-sm text-gray-400 mb-2">
                    <span id="question-counter">Question 1 of 5</span>
                    <span id="progress-percent">20%</span>
                </div>
                <div class="h-2 w-full bg-gray-700 rounded-full overflow-hidden">
                    <div id="progress-bar" class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 transition-all duration-500" style="width: 20%;"></div>
                </div>
            </div>

            <!-- Quiz Card -->
            <div id="quiz-card" class="glass p-8 md:p-12 rounded-2xl relative shadow-2xl min-h-[400px] flex flex-col justify-center">
                
                <h2 id="question-text" class="text-2xl md:text-3xl font-semibold mb-8 text-center text-white">How do you prefer to solve problems?</h2>
                
                <div id="options-container" class="space-y-4">
                    <!-- Options will be dynamically injected here -->
                </div>

                <div class="mt-8 flex justify-between">
                    <button id="prev-btn" class="px-6 py-2 rounded-full border border-gray-500 text-gray-300 hover:bg-white/10 transition hidden">Previous</button>
                    <button id="next-btn" class="px-6 py-2 rounded-full bg-indigo-600 text-white hover:bg-indigo-500 transition shadow-lg btn-glow disabled:opacity-50 disabled:cursor-not-allowed hidden ml-auto">Next</button>
                </div>

            </div>

            <!-- Result Card (Hidden by default) -->
            <div id="result-card" class="glass p-8 md:p-12 rounded-2xl relative shadow-2xl text-center hidden flex-col items-center">
                <div class="w-24 h-24 bg-green-500/20 rounded-full flex items-center justify-center mb-6">
                    <span class="text-5xl">🎯</span>
                </div>
                <h2 class="text-3xl font-bold mb-4 text-gradient">Test Completed!</h2>
                <p class="text-gray-300 mb-8 max-w-md mx-auto">Based on your answers, our AI has compiled your personalized skill profile and career recommendations.</p>
                
                <div class="grid grid-cols-2 gap-4 mb-8 w-full max-w-sm">
                    <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                        <div class="text-xs text-gray-400">Logic Score</div>
                        <div class="text-xl font-bold text-indigo-400">85%</div>
                    </div>
                    <div class="bg-white/5 p-4 rounded-xl border border-white/10">
                        <div class="text-xs text-gray-400">Creativity Score</div>
                        <div class="text-xl font-bold text-purple-400">92%</div>
                    </div>
                </div>

                <a href="skill-analysis.html" class="px-8 py-3 rounded-full bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-medium hover:shadow-lg transition btn-glow">View Full Analysis</a>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
