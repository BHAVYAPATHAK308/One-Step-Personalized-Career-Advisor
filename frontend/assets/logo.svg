<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="100%" height="100%">
  <defs>
    <!-- Premium Gradient -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Hexagon/Abstract Path Symbol -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <path d="M 20 0 L 35 10 L 35 30 L 20 40 L 5 30 L 5 10 Z" fill="none" stroke="url(#logoGradient)" stroke-width="4" stroke-linejoin="round" />
    <path d="M 12 15 L 28 25 L 20 32" fill="none" stroke="url(#logoGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="20" cy="20" r="4" fill="url(#logoGradient)" />
  </g>

  <!-- Career101 Text / Custom Brand typography -->
  <text x="60" y="38" font-family="'Inter', sans-serif" font-weight="800" font-size="28" fill="#ffffff" letter-spacing="-0.5">
    Career<tspan fill="url(#logoGradient)">101</tspan>
  </text>
  
</svg>
